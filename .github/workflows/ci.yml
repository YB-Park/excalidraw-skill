name: CI

on:
  push:
    branches:
      - main
      - 'vnext/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run smoke
      - run: npm run smoke:system
      - run: npm run smoke:module
      - name: Evaluate strict quality gates
        run: npm run evaluate:strict
      - name: Compare layout candidates
        run: npm run research:layouts
      - name: Export deterministic visual review previews
        run: |
          mkdir -p artifacts/visual-review artifacts/stress-scenes
          node ./src/export-preview-svg.mjs examples/service-flow/payment-flow.visual-plan.excalidraw -o artifacts/visual-review/payment-flow.svg
          node ./src/export-preview-svg.mjs examples/system-architecture/layered-middleware.excalidraw -o artifacts/visual-review/system-layered.svg
          node ./src/export-preview-svg.mjs examples/module-architecture/connection-manager.excalidraw -o artifacts/visual-review/module-component.svg
          cp examples/service-flow/payment-flow.visual-plan.excalidraw.editability.json artifacts/visual-review/payment-flow.editability.json
          cp examples/service-flow/payment-flow.visual-plan.excalidraw.quality.json artifacts/visual-review/payment-flow.quality.json
          cp examples/service-flow/payment-flow.visual-plan.excalidraw.perceptual.json artifacts/visual-review/payment-flow.perceptual.json
          cp examples/system-architecture/layered-middleware.excalidraw.editability.json artifacts/visual-review/system-layered.editability.json
          cp examples/system-architecture/layered-middleware.excalidraw.quality.json artifacts/visual-review/system-layered.quality.json
          cp examples/system-architecture/layered-middleware.excalidraw.perceptual.json artifacts/visual-review/system-layered.perceptual.json
          cp examples/module-architecture/connection-manager.excalidraw.editability.json artifacts/visual-review/module-component.editability.json
          cp examples/module-architecture/connection-manager.excalidraw.quality.json artifacts/visual-review/module-component.quality.json
          cp examples/module-architecture/connection-manager.excalidraw.perceptual.json artifacts/visual-review/module-component.perceptual.json
          cp examples/evaluation/results/layout-candidates.latest.json artifacts/visual-review/layout-candidates.latest.json
          for id in flow-branch-merge flow-fanout-fanin flow-feedback-loop flow-long-labels; do
            cp "examples/evaluation/outputs/${id}.excalidraw" "artifacts/stress-scenes/${id}.excalidraw"
            cp "examples/evaluation/outputs/${id}.excalidraw.quality.json" "artifacts/stress-scenes/${id}.quality.json"
            cp "examples/evaluation/outputs/${id}.excalidraw.perceptual.json" "artifacts/stress-scenes/${id}.perceptual.json"
            cp "examples/evaluation/outputs/${id}.excalidraw.editability.json" "artifacts/stress-scenes/${id}.editability.json"
            cp "examples/evaluation/outputs/${id}.excalidraw.route-integrity.json" "artifacts/stress-scenes/${id}.route-integrity.json"
          done
      - name: Install Chromium for actual-render review
        run: npx playwright install --with-deps chromium
      - name: Generate patch round-trip review scenes
        run: node ./src/generate-patch-review-scenes.mjs
      - name: Export patch round-trip actual previews
        run: |
          mkdir -p artifacts/patch-actual
          for id in payment-add-audit payment-local-edit payment-insert-auth payment-remove-worker payment-move-worker-down payment-relabel-service payment-rewire-worker; do
            npm run visual:actual -- "artifacts/patch-scenes/${id}.excalidraw" -o "artifacts/patch-actual/${id}.png"
          done
      - name: Verify patch round-trip actual signatures
        run: npm run visual:verify:patch
      - name: Export all runnable actual Excalidraw previews
        run: npm run visual:actual:suite
      - name: Verify actual Excalidraw render signatures
        run: npm run visual:verify
      - uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: artifacts
          if-no-files-found: error
