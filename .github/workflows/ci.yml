name: CI

on:
  push:
    branches:
      - main
      - 'vnext/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run smoke
      - run: npm run smoke:system
      - run: npm run smoke:module
      - run: npm run evaluate
